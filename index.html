<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">  
    <title>News channels</title>
</head> 
<body>
    <div>
        <h1 style="font-size:8vw;text-align: center;">Hello World</h1>
        <p>
            A relatively un-biased by it's completion news aggregate of world affairs
        </p>
        <div class="device-box">
            <div class="device">
            <picture >
                <source srcset="assets/3G_Nano_iPod.svg" media="(max-width:500px)">
                <source srcset="assets/old-tv-television-empty-screen-2.png">
                <img src="assets/3G_Nano_iPod.svg" alt="IPod" style="width:100%;">
            </picture>
                <div class="screen-box">
                    <iframe name="iframe-screen" class="screen" 
                        src="https://www.youtube.com/embed/gCNeDWCI0vo?si=8JExTpSWaOcD4cBr&autoplay=1&start=2" 
                        allow="accelerometer; autoplay; picture-in-picture;" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen></iframe>
                </div>
            </div>
        </div>
        <div class="remote-box">
            <ul>
                <li><a target="iframe-screen" href="https://www.youtube.com/embed/gCNeDWCI0vo?si=8JExTpSWaOcD4cBr&autoplay=1&start=2">Al Jazeera</a></li>
                <li><a target="iframe-screen" href="https://www.bbc.com/watch-live-news">BBC</a></li>
                <li><a target="iframe-screen" href="https://www.youtube.com/embed/5vfaDsMhCF4?si=hjZU_bsDsS3x0k3J&autoplay=1">CBC News</a></li>
                <li><a target="iframe-screen" href="https://www.youtube.com/embed/HvZt-nh9sGg?si=JqB5rOt1reqL4zVg&autoplay=1">France 24</a></li>
            </ul>
        </div>
    </div>
</body>   
</html>
