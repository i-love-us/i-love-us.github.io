<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">  
    <title>News Channel Aggregate</title>
</head> 
<body>
    <div>
        <h1 style="font-size:8vw;text-align: center;">Hello World News</h1>
        <p>
            A relatively un-biased by it's completion news aggregate of world affairs. Brought to you by i love us.
        </p>
        <div class="device-box">
            <div class="device">
            <picture >
                <source srcset="assets/3G_Nano_iPod.svg" media="(max-width:545px)">
                <source srcset="assets/old-tv-television-empty-screen-2.png">
                <img src="assets/3G_Nano_iPod.svg" alt="IPod" style="width:100%;">
            </picture>
                <div class="screen-box">
                    <iframe name="iframe-screen" class="screen" 
                        src="https://www.youtube.com/embed/gCNeDWCI0vo?si=8JExTpSWaOcD4cBr&autoplay=1" 
                        allow="accelerometer; autoplay; picture-in-picture;" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen></iframe>
                </div>
            </div>
            <div class="remote-box">
                <ul>
                    <li><a target="iframe-screen" href="https://www.youtube.com/embed/gCNeDWCI0vo?si=8JExTpSWaOcD4cBr&autoplay=1" data-desc="Qatar-based coverage of Middle East and global affairs">Al Jazeera</a></li>
                    <li><a target="iframe-screen" href="https://www.bbc.com/watch-live-news" data-desc="UK public broadcaster, international news desk">BBC</a></li>
                    <li><a target="iframe-screen" href="https://www.youtube.com/embed/5vfaDsMhCF4?si=hjZU_bsDsS3x0k3J&autoplay=1" data-desc="Canada's national broadcast news">CBC News</a></li>
                    <li><a target="iframe-screen" href="https://www.youtube.com/embed/HvZt-nh9sGg?si=JqB5rOt1reqL4zVg&autoplay=1" data-desc="French international news network, English edition">France 24</a></li>
                    <li><a target="iframe-screen" href="https://www.youtube.com/embed/zaz4-_u_OHY?si=zn44k_jNiolnTaPX&autoplay=1" data-desc="US network news coverage">NBC</a></li>
                    <li><a target="iframe-screen" href="https://www.youtube.com/embed/iipR5yUp36o?si=7_BfOvSU9_daTWKo&autoplay=1" data-desc="US network news coverage">ABC</a></li>
                    <li><a target="iframe-screen" href="https://www.youtube.com/embed/Y4WnJg78JIk?si=mh2Q00lIhpmS64kA&autoplay=1" data-desc="US network news coverage">CBS</a></li>
                    <li><a target="iframe-screen" href="https://www.youtube.com/embed/QB5BNdBFujE?si=Tu1h7jwSMoBuNy9X&autoplay=1" data-desc="Bloomberg financial news and market analysis">Bloomberg TV</a></li> 
                    <!-- <li><a target="iframe-screen" href="&autoplay=1"></a></li>                 -->
                </ul>
            </div>
        </div>

    </div>
</body>   
</html>
